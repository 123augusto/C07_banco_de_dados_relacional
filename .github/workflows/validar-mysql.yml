name: Validar integração com MySQL
on:
  push:
    branches: [validacao-mysql]
permissions:
  contents: read
jobs:
  integracao:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Obter a entrega
        run: |
          git clone --branch validacao-mysql --depth 1 "https://github.com/$GITHUB_REPOSITORY.git" c07
          cd c07
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Iniciar servidor isolado
        run: |
          docker run -d --name c07-mysql --network host -e MYSQL_ROOT_PASSWORD=teste-isolado mysql:8.0 --bind-address=127.0.0.1 --mysqlx=0
          for tentativa in {1..40}; do
            if docker exec c07-mysql mysql -uroot -pteste-isolado -h127.0.0.1 -N -e "SELECT 1"; then
              exit 0
            fi
            sleep 3
          done
          docker logs c07-mysql
          exit 1
      - name: Instalar o cliente e validar a aplicação
        working-directory: c07
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r entrega_03/requirements.txt
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          import pymysql

          def carregar(nome):
              return subprocess.run(
                  ["docker", "exec", "-i", "c07-mysql", "mysql", "-uroot",
                   "-pteste-isolado", "--default-character-set=utf8mb4", "-BNr"],
                  input=Path("entrega_03", nome).read_text(encoding="utf-8"),
                  text=True, capture_output=True, check=True,
              ).stdout

          carregar("festival_final.sql")
          senha = carregar("usuario_aplicacao.sql").splitlines()[0].split("\t")[2]
          ambiente = dict(os.environ, C07_DB_PASSWORD=senha)

          def menu(*entradas):
              resultado = subprocess.run(
                  [sys.executable, "entrega_03/main.py"],
                  input="\n".join([*entradas, "0", ""]), env=ambiente,
                  text=True, capture_output=True, timeout=15,
              )
              assert resultado.returncode == 0, resultado.stdout + resultado.stderr
              assert "não concluíd" not in resultado.stdout, resultado.stdout
              return resultado.stdout

          for tabela, quantidade in enumerate((11, 5, 6, 5, 6, 16, 5), 1):
              saida = menu(str(tabela), "2", "3", "1", "9999", "0")
              assert f"{quantidade} registro(s)." in saida and "Nenhum registro encontrado." in saida, saida
          saida = menu("8", "1", "2", "3", "0")
          assert all(f"{n} registro(s)." in saida for n in (6, 5, 16)), saida
          assert "Luiza Freitas" in saida and "Sala de apoio" in saida, saida

          saida = menu("1", "1", "Rita D'Ávila", "rita@example.com", "", "3", "2", "Rita D'Ávila", "0")
          assert "ID: 12" in saida and "1 registro(s)." in saida, saida
          assert "Cadastro realizado" in menu("3", "1", "12", "Estudante", "0")
          assert "Cadastro realizado" in menu("6", "1", "12", "1", "", "", "1", "12", "2", "", "", "0")
          assert "2 registro(s) alterado(s)" in menu("6", "4", "2", "1", "1", "1", "12", "0")
          assert "Registro excluído" in menu("6", "5", "12", "1", "SIM", "0")
          assert "Atualização cancelada" in menu("4", "4", "2", "50", "2", "CANCELAR", "0")
          assert "5 registro(s) alterado(s)" in menu("4", "4", "2", "50", "2", "TODOS", "0")

          with pymysql.connect(host="127.0.0.1", user="festival_app", password=senha,
                               database="festival_inovacao_final", charset="utf8mb4") as conexao:
              with conexao.cursor() as cursor:
                  cursor.execute("SELECT id_atividade, status_checkin, data_inscricao IS NOT NULL "
                                 "FROM inscricoes_atividade WHERE id_participante=12")
                  assert cursor.fetchall() == ((2, 1, 1),)
                  cursor.execute("SELECT DISTINCT capacidade_maxima FROM espaco")
                  assert cursor.fetchall() == ((50,),)
          print("MySQL 8: script final, conta da aplicação, trigger, JOINs e fluxos do menu conferidos.")
          PY
